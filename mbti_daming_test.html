let scores = { EI:0, SN:0, TF:0, JP:0 };
let current = 0;

function startTest() {
  document.getElementById('startCard').classList.add('hidden');
  document.getElementById('quizCard').classList.remove('hidden');
  renderProgress();
  showQuestion();
}

function renderProgress() {
  const wrap = document.getElementById('progress');
  wrap.innerHTML = '';
  for (let i=0;i<questions.length;i++) {
    const d = document.createElement('div');
    d.className = 'dot';
    if (i < current) d.className += ' done';
    else if (i === current) d.className += ' active';
    wrap.appendChild(d);
  }
}

function showQuestion() {
  const q = questions[current];
  document.getElementById('question').textContent = q.q;
  const wrap = document.getElementById('options');
  wrap.innerHTML = '';
  q.a.forEach((txt, idx) => {
    const btn = document.createElement('div');
    btn.className = 'option fade-in';
    btn.textContent = txt;
    btn.onclick = () => select(idx);
    wrap.appendChild(btn);
  });
  renderProgress();
}

function select(idx) {
  const dim = questions[current].dim;
  if (dim === 'EI') scores.EI += (idx===0?1:-1);
  if (dim === 'SN') scores.SN += (idx===0?1:-1);
  if (dim === 'TF') scores.TF += (idx===0?1:-1);
  if (dim === 'JP') scores.JP += (idx===0?1:-1);
  current++;
  if (current >= questions.length) showResult();
  else showQuestion();
}

function getType() {
  const e = scores.EI >= 0 ? 'E' : 'I';
  const s = scores.SN >= 0 ? 'S' : 'N';
  const t = scores.TF >= 0 ? 'T' : 'F';
  const j = scores.JP >= 0 ? 'J' : 'P';
  return e+s+t+j;
}

function showResult() {
  const type = getType();
  const r = results[type] || results['INFJ'];
  document.getElementById('quizCard').classList.add('hidden');
  const card = document.getElementById('resultCard');
  card.classList.remove('hidden');
  document.getElementById('charName').textContent = r.name;
  document.getElementById('mbtiType').textContent = r.mbti;
  document.getElementById('quote').textContent = r.quote;
  document.getElementById('analysis').innerHTML = r.analysis;
}

function restart() {
  scores = { EI:0, SN:0, TF:0, JP:0 };
  current = 0;
  document.getElementById('resultCard').classList.add('hidden');
  document.getElementById('startCard').classList.remove('hidden');
}
</script>
</body>
</html>
